version: "3"
env:
  PYTHONDONTWRITEBYTECODE: "1"
tasks:
  verify:
    desc: Qualify the pinned Xberg Swift consumer on an admitted hosted macOS executor
    cmds:
      - task: controls
      - python3 '{{.TASKFILE_DIR}}/../scripts/consumer-swift/entry.py'
  controls:
    desc: Run all 45 hosted consumer harness controls with resource and process cleanup guards
    cmds:
      - python3 '{{.TASKFILE_DIR}}/../scripts/consumer-swift/entry.py' --controls
