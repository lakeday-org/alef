name: Windows Zig timeout probe

on:
  push:
    branches: [codex/windows-zig-timeout-probe]

permissions:
  contents: read

concurrency:
  group: windows-zig-probe-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  probe:
    name: Zig probe (${{ matrix.mode }})
    runs-on: windows-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        mode: [serial, concurrent]
    env:
      CARGO_BUILD_JOBS: "1"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: xberg-io/actions/install-task@f2be77fcc9149c34363aa08de6ba8abb60b04d0c
        with:
          version: "3.54.0"
      - uses: xberg-io/actions/setup-rust@cc89740654cef67b752113ddd87d4f0d23dda3f5
        with:
          install-llvm-cov: "false"
          cache-key-prefix: windows-zig-probe
      - uses: xberg-io/actions/setup-zig@cc89740654cef67b752113ddd87d4f0d23dda3f5
        with:
          version: "0.17.0"
      - name: Build the frozen unit test executable
        run: task test:zig:probe:build
      - name: Run measured cases
        run: task test:zig:probe MODE=${{ matrix.mode }}
      - name: Collect verdicts and input hashes
        if: always()
        run: task test:zig:probe:collect
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: windows-zig-probe-${{ matrix.mode }}-${{ github.sha }}
          path: .alef/zig-timeout-probe/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
