version: '3'
tasks:
  setup:
    cmds:
      - dart pub get
  generate:
    cmds:
      - flutter_rust_bridge_codegen generate --rust-root rust --rust-input crate --rust-output rust/src/frb_generated.rs --dart-root . --dart-output lib/bridge --no-add-mod-to-lib --no-web --no-deps-check --no-auto-upgrade-dependency --stop-on-error
  build:
    cmds:
      - cargo build --manifest-path rust/Cargo.toml
  test:
    cmds:
      - dart run check.dart {{.CLI_ARGS}}
  compile-cfg:
    cmds:
      - rustc --crate-type=lib --edition=2024 cfg_probe.rs --out-dir .
