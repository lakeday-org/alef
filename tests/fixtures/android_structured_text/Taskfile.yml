version: "3"
tasks:
  rust:
    cmds:
      - cargo build --workspace
  dependencies:
    cmds:
      - mvn -q dependency:build-classpath -Dmdep.outputFile=classpath.txt
  kotlin-compile:
    cmds:
      - kotlinc *.kt -cp "{{.CLASSPATH}}" -include-runtime -d probe.jar
  kotlin-run:
    cmds:
      - java -Djava.library.path=native-target/debug -cp "probe.jar{{if eq OS "windows"}};{{else}}:{{end}}{{.CLASSPATH}}" sample.MainKt
  kotlin:
    cmds:
      - task: kotlin-compile
        vars:
          CLASSPATH: '{{.CLASSPATH}}'
      - task: kotlin-run
        vars:
          CLASSPATH: '{{.CLASSPATH}}'
