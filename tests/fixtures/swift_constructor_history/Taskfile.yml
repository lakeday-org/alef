version: "3"
tasks:
  rust-build:
    cmds:
      - cargo build --manifest-path packages/swift/rust/Cargo.toml --jobs 1
  bridge-build:
    cmds:
      - >-
        swiftc -I native -module-name RustBridge -parse-as-library -whole-module-optimization
        -emit-module -emit-module-path native/RustBridge.swiftmodule
        -emit-object native/RustBridge.swift packages/swift/Sources/RustBridge/ZSwift*.swift
        -o native/RustBridge.o
  facade-build:
    cmds:
      - >-
        swiftc -I native -module-name Fixture -parse-as-library -whole-module-optimization
        -emit-module -emit-module-path native/Fixture.swiftmodule
        -emit-object packages/swift/Sources/Fixture/Fixture.swift -o native/Fixture.o
  link:
    cmds:
      - >-
        swiftc -I native native/probe.swift native/Fixture.o native/RustBridge.o
        "{{.CARGO_TARGET_DIR}}/debug/libfixture_swift.a" -o native/probe
  run:
    cmds:
      - ./native/probe {{.MODE}}
  negative-typecheck:
    cmds:
      - swiftc -I native -typecheck native/negative.swift
