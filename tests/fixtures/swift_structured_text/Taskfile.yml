version: "3"
tasks:
  rust:
    cmds:
      - cargo build --workspace
  materialize:
    cmds:
      - '"{{.TEST_BINARY}}" --exact backends::swift::gen_rust_crate::structured_text_tests::native_structured_text_bridge_preserves_parts --ignored --nocapture'
  swift:
    cmds:
      - swift run --package-path . Probe
  suite:
    cmds:
      - swift test --package-path .
  suite-replay:
    cmds:
      - swift test --package-path . --skip-build
