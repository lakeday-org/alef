version: "3"
vars:
  XCODE_PLATFORM:
    sh: 'if command -v xcrun >/dev/null; then xcrun --show-sdk-platform-path; fi'
tasks:
  build:
    cmds:
      - >-
        swiftc -module-name Sample
        {{if eq OS "darwin"}}-F "{{.XCODE_PLATFORM}}/Developer/Library/Frameworks"
        -I "{{.XCODE_PLATFORM}}/Developer/usr/lib" -L "{{.XCODE_PLATFORM}}/Developer/usr/lib"
        -lXCTestSwiftSupport -Xlinker -rpath -Xlinker "{{.XCODE_PLATFORM}}/Developer/usr/lib"
        -Xlinker -rpath -Xlinker "{{.XCODE_PLATFORM}}/Developer/Library/Frameworks"{{end}}
        probe.swift -o probe
  run:
    cmds:
      - ./probe {{.MODE}}
  rust-check:
    cmds:
      - cargo check --manifest-path bridge/Cargo.toml
  rust-test:
    cmds:
      - cargo test --manifest-path bridge/Cargo.toml --lib -- --nocapture
