[tasks.build]
run = '''
set --
if [ "$(uname)" = Darwin ]; then
  platform=$(xcrun --show-sdk-platform-path)
  set -- -F "$platform/Developer/Library/Frameworks" \
    -I "$platform/Developer/usr/lib" -L "$platform/Developer/usr/lib" \
    -lXCTestSwiftSupport -Xlinker -rpath -Xlinker "$platform/Developer/usr/lib" \
    -Xlinker -rpath -Xlinker "$platform/Developer/Library/Frameworks"
fi
swiftc -module-name Sample "$@" probe.swift -o probe
'''

[tasks.run]
run = "./probe ${MODE:-}"

[tasks.rust-check]
run = "cargo check --manifest-path bridge/Cargo.toml"

[tasks.rust-test]
run = "cargo test --manifest-path bridge/Cargo.toml --lib -- --nocapture"
